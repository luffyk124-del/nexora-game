<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b"><title>NEXORA Reports Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body><main id="app">
<header><div class="brand"><span class="mark">N</span><div><b>NEXORA</b><small>REPORTS CENTER</small></div></div><span class="secure">بوابة إدارية آمنة</span></header>
<section id="login" class="panel login"><div class="eyebrow">ADMIN ACCESS</div><h1>مركز البلاغات</h1><p>منصة مستقلة لمراجعة بلاغات لاعبي NEXORA.</p>
<button id="loginBtn" class="primary">المتابعة باستخدام Google</button>
<small class="muted">الدخول محمي بحساب Google وبصلاحية مشرف معتمدة داخل NEXORA.</small>
<div id="loginError" class="error" role="alert"></div></section>
<section id="dashboard" hidden>
<div class="welcome"><div><div class="eyebrow">MODERATION WORKSPACE</div><h1>لوحة البلاغات</h1><p>مراجعة البلاغات وإدارة حالتها.</p></div><button id="logoutBtn" class="quiet">تسجيل الخروج</button></div>
<nav id="filters"><button data-status="all" class="active">الكل</button><button data-status="open">مفتوحة</button><button data-status="reviewing">قيد المراجعة</button><button data-status="closed">مغلقة</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="بحث برقم البلاغ أو معرّف اللاعب"><button id="auditBtn" class="quiet">سجل إجراءات المشرفين</button></div>
<div id="summary" class="summary"></div><div id="notice" role="status"></div><div id="reports" class="reports"></div>
</section>
<footer>NEXORA · Reports Center · الوصول مراقب ومقيد</footer></main><script type="module" src="./app.js"></script></body></html>
