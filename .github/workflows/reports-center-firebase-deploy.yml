name: Deploy NEXORA Reports Center to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Reports Center
        working-directory: reports-center
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          test -s dist/index.html

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only the Reports Center Hosting site
        run: firebase deploy --only hosting --project gen-lang-client-0074900177 --non-interactive
