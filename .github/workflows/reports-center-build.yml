name: Reports Center frontend build

on:
  pull_request:
    paths:
      - "reports-center/**"
      - ".github/workflows/reports-center-build.yml"
  push:
    branches:
      - "feature/reports-center-github-pages"
    paths:
      - "reports-center/**"
      - ".github/workflows/reports-center-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build static frontend
        run: npm run build
      - name: Verify output
        run: test -s dist/index.html
